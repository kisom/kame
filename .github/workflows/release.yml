name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REPO: kisom/kame

jobs:
  check:
    # macOS, as the app job is: the whole workspace builds there with nothing to install, the app
    # and its tests included, where Linux would need the windowing and graphics libraries first.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the versions in the tree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          cargo_ver="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          plist_ver="$(grep -A1 '<key>CFBundleShortVersionString</key>' packaging/macos/Info.plist | sed -n 's|.*<string>\(.*\)</string>.*|\1|p')"
          ok=1
          if [ "$cargo_ver" != "$want" ]; then
            echo "::error::tag $TAG wants version $want, but Cargo.toml says $cargo_ver"
            ok=0
          fi
          if [ "$plist_ver" != "$want" ]; then
            echo "::error::tag $TAG wants version $want, but Info.plist CFBundleShortVersionString says $plist_ver"
            ok=0
          fi
          [ "$ok" = 1 ] || exit 1
          echo "tag $TAG matches Cargo.toml and Info.plist"
      # The release's notes are its section of the changelog, so it has to have one.
      - name: The changelog has this release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! grep -q "^## \[${TAG#v}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${TAG#v}]' section; write this release's notes there and tag that"
            exit 1
          fi
          echo "CHANGELOG.md has ${TAG#v}"
      # What this release writes, every later build's tests read, so it has to be there before the tag.
      - name: The release has samples for later builds to read
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          samples="crates/kame-core/tests/samples/${TAG#v}"
          missing=0
          for f in essay.kame essay.md essay.html essay.json logged.json logged/.kame-logs \
            logged/.essay.kame.sync/talos-aaaa.log logged/.essay.kame.sync/titan-bbbb.log; do
            [ -e "$samples/$f" ] || { echo "::error::$samples/$f is missing"; missing=1; }
          done
          if [ "$missing" = 1 ]; then
            echo "::error::run 'cargo run -p kame-sync --example write_samples' at the release commit, commit what it writes, and tag that"
            exit 1
          fi
          echo "$samples is there"
      # Every release's samples are read here, this one's among them, along with everything else.
      - name: Test the workspace
        run: cargo test

  macos:
    needs: check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build the app bundle
        run: make mac-app
      - name: Zip the app
        run: ditto -c -k --sequesterRsrc --keepParent target/kame.app kame.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kame.app.zip
          path: kame.app.zip
          if-no-files-found: error

  release:
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kame.app.zip
      - name: Take this release's notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          awk -v head="## [${TAG#v}]" 'index($0, head) == 1 { found = 1; next } found && /^## \[/ { exit } found' \
            CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "::error::CHANGELOG.md's ${TAG#v} section is empty"; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=()
          case "$TAG" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$TAG" kame.app.zip \
            --repo "$REPO" \
            --title "$TAG" \
            --notes-file release-notes.md \
            "${flags[@]}"

  tap:
    needs: release
    # A tag with a - in it is a prerelease, which the tap never follows.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      GH_CPAT: ${{ secrets.GH_CPAT }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Skip without GH_CPAT
        id: gate
        run: |
          if [ -z "$GH_CPAT" ]; then
            echo "::notice::GH_CPAT is empty, so the Homebrew tap was not updated"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Hash the source and the app
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o source.tar.gz "https://github.com/$REPO/archive/refs/tags/$TAG.tar.gz"
          curl -fsSL -o kame.app.zip "https://github.com/$REPO/releases/download/$TAG/kame.app.zip"
          {
            echo "SRC_SHA=$(sha256sum source.tar.gz | cut -d' ' -f1)"
            echo "APP_SHA=$(sha256sum kame.app.zip | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"
      - name: Check out the tap
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: kisom/homebrew-tap
          ref: master
          token: ${{ secrets.GH_CPAT }}
          path: tap
      - name: Update the formula and the cask
        if: steps.gate.outputs.run == 'true'
        working-directory: tap
        run: |
          set -euo pipefail
          for f in Formula/kame-site.rb Casks/kame.rb; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is not in kisom/homebrew-tap, so there is nothing to update"
              exit 1
            fi
          done
          version="${TAG#v}"
          sed -i \
            -e "s|^\( *url \"https://github.com/$REPO/archive/refs/tags/\)[^\"]*\"|\1$TAG.tar.gz\"|" \
            -e "s|^\( *sha256 \)\"[^\"]*\"|\1\"$SRC_SHA\"|" \
            Formula/kame-site.rb
          sed -i \
            -e "s|^\( *version \)\"[^\"]*\"|\1\"$version\"|" \
            -e "s|^\( *sha256 \)\"[^\"]*\"|\1\"$APP_SHA\"|" \
            Casks/kame.rb
          grep -q "refs/tags/$TAG.tar.gz\"" Formula/kame-site.rb || { echo "::error::no url line updated in Formula/kame-site.rb"; exit 1; }
          grep -q "sha256 \"$SRC_SHA\"" Formula/kame-site.rb || { echo "::error::no sha256 line updated in Formula/kame-site.rb"; exit 1; }
          grep -q "version \"$version\"" Casks/kame.rb || { echo "::error::no version line updated in Casks/kame.rb"; exit 1; }
          grep -q "sha256 \"$APP_SHA\"" Casks/kame.rb || { echo "::error::no sha256 line updated in Casks/kame.rb"; exit 1; }
      - name: Commit and push
        if: steps.gate.outputs.run == 'true'
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kame-site.rb Casks/kame.rb
          if git diff --cached --quiet; then
            echo "::notice::the tap already has $TAG"
            exit 0
          fi
          git commit -m "kame ${TAG#v}"
          git push origin HEAD:master

  # What someone gets from the tap, on a Mac that has never seen kame.
  verify:
    needs: tap
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: macos-26
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Install kame from the tap
        run: |
          set -euo pipefail
          brew tap kisom/tap
          brew install kisom/tap/kame
      - name: Check the app
        run: |
          set -euo pipefail
          app=/Applications/kame.app
          want="${TAG#v}"
          test -d "$app" || { echo "::error::brew install kisom/tap/kame left no $app"; exit 1; }
          got="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          [ "$got" = "$want" ] || { echo "::error::the tap installed kame.app $got, not $want"; exit 1; }
          ran="$("$app/Contents/MacOS/kame" --version)"
          [ "$ran" = "kame $want" ] || { echo "::error::the installed kame says \"$ran\", not \"kame $want\""; exit 1; }
          codesign --verify --deep "$app"
          if xattr -p com.apple.quarantine "$app" >/dev/null 2>&1; then
            echo "::error::kame.app is still quarantined, so macOS would refuse to open it"
            exit 1
          fi
          # The app's own binary runs its site tool without a window.
          "$app/Contents/MacOS/kame" site new "$RUNNER_TEMP/app-site"
          test -f "$RUNNER_TEMP/app-site/site.yaml"
      - name: Install and test kame-site from the tap
        run: |
          set -euo pipefail
          brew install kisom/tap/kame-site
          brew test kisom/tap/kame-site
          got="$(brew list --versions kame-site | awk '{print $2}')"
          [ "$got" = "${TAG#v}" ] || { echo "::error::the tap built kame-site $got, not ${TAG#v}"; exit 1; }
