[package]
name = "kame"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.37"
egui = "0.37"
cosmic-text = { version = "0.19", features = ["swash"] }
swash = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
image = "0.25"
pulldown-cmark = { version = "0.13", default-features = false }

# rfd's file dialog backend is platform-specific: the XDG desktop portal on
# Linux, the native AppKit panels on macOS (compiled in automatically via
# target-gated deps, no feature flag). The synchronous `FileDialog` API is
# identical on both, so only the feature set differs.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.15", default-features = false }
# All already built by eframe; named directly for the application delegate, which
# receives files opened from Finder and every way of quitting, and the event loop it
# has to be installed before.
winit = { version = "0.30", default-features = false }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSObject", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }
