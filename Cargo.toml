[package]
name = "kame"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.37"
egui = "0.37"
cosmic-text = { version = "0.19", features = ["swash"] }
swash = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
image = "0.25"
