[package]
name = "kame-core"
version = "0.1.2"
license = "Apache-2.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
kame-test-dir = { path = "../kame-test-dir" }
