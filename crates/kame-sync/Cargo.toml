[package]
name = "kame-sync"
version = "0.1.0"
edition = "2021"
description = "Proof of concept: merging one person's diverged kame documents. See docs/superpowers/specs/2026-11-03-sync-design.md."

[dependencies]
kame-core = { path = "../kame-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
kame-test-dir = { path = "../kame-test-dir" }
